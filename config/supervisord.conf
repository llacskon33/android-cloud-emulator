[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=Xvfb :0 -screen 0 %(ENV_SCREEN_RESOLUTION)s
priority=10
autorestart=true

[program:fluxbox]
command=fluxbox
priority=20
autorestart=true

[program:x11vnc]
command=/opt/scripts/run-vnc.sh
priority=30
autorestart=true

[program:novnc]
command=websockify --web=/usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true

[program:emulator]
command=/opt/scripts/run-emulator.sh
priority=50
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
